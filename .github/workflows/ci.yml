name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK 37 (runner's preinstalled SDK)
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: "Unit tests, lint and debug APK (no keys needed: the app builds in unconfigured mode)"
        run: ./gradlew check :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lectureloop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
